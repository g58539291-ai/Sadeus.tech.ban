<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominons le monde — Sadeus</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at center, #500000 0%, #180000 42%, #030303 100%);
            color: white;
            font-family: Arial, sans-serif;
        }

        .scene {
            position: relative;
            width: 270px;
            height: 270px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .globe {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, #8b0000, #350000 65%, #090000);
            border: 2px solid #b00000;
            box-shadow:
                0 0 25px rgba(200, 0, 0, 0.45),
                inset -20px -15px 30px rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
            position: relative;
            z-index: 2;
        }

        .snake {
            position: absolute;
            width: 245px;
            height: 245px;
            border: 7px solid #9d0000;
            border-right-color: transparent;
            border-radius: 50%;
            animation: orbit 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(220, 0, 0, 0.7));
        }

        .snake::after {
            content: "𓆙";
            position: absolute;
            right: -10px;
            top: 15px;
            font-size: 42px;
            transform: rotate(35deg);
        }

        @keyframes orbit {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            margin: 15px 0 8px;
            font-size: 25px;
            letter-spacing: 4px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .subtitle {
            color: #aaa;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        .continue {
            padding: 14px 30px;
            border: 1px solid #a00000;
            border-radius: 10px;
            background: #700000;
            color: white;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 18px rgba(160, 0, 0, 0.25);
        }

        .continue:hover {
            background: #a00000;
        }

        footer {
            position: fixed;
            bottom: 18px;
            font-size: 11px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="scene">
        <div class="snake"></div>

        <div class="globe">
            🌎
        </div>
    </div>

    <h1>DOMINONS LE MONDE</h1>

    <div class="subtitle">
        SADEUS SYSTEM
    </div>

    <a class="continue" href="/report">
        ACCÉDER AU SIGNALement
    </a>

    <footer>
        Powered by Gojo Sadeus
    </footer>

</body>
</html>
